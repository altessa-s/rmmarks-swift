# SwiftLint for RMMarks. Run it from the repository root: `swiftlint`.
#
# What this configuration is for: the mechanical mistakes a reader stops
# noticing — a force unwrap that takes the whole run down with a signal,
# `count == 0` where `isEmpty` was meant, a `%` that means `isMultiple(of:)`.
# What it is deliberately not for is the shape of the code. Those decisions
# this package has already made and written down in the comments above each
# one, and a linter repeating them at every build teaches nothing that review
# does not.
#
# Every number below describes this tree, and every rule that is off is off
# for a reason given on the spot. Nine files of sources and three of tests,
# the longest of them `MarkedText.swift` at 352 lines and
# `MarkedTextTests.swift` at 370 — the one file of rules and the pages that
# pin them. `file_length` is why the tests are split: the vocabulary's own
# tests are in `VocabularyTests.swift`, so neither file passes 400 lines,
# which is the ceiling doing its job rather than a number to raise.

excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  # Generated by XcodeGen from project.yml for the framework build, and
  # ignored rather than committed. It holds no Swift of its own; it is named
  # here so a stray lint of a generated tree stays quiet.
  - RMMarks.xcodeproj

disabled_rules:
  # 12 occurrences, consistently, across Package.swift and the tests. That
  # is a house style, and the linter does not get a vote.
  - trailing_comma

# The size-and-complexity family is on entire, at its defaults, and every
# rule in it is at zero: `file_length`, `function_body_length`,
# `cyclomatic_complexity`, `type_body_length`, `nesting` and
# `function_parameter_count`. The margins are wide and worth writing down,
# because they are what makes leaving the rules on cost nothing: the longest
# body in the tree is `MarkedText.passages` at 25 lines against a ceiling of
# 50, `MarkedText.blocks` follows at 21, and the most branching anywhere is
# complexity 5 against a ceiling of 10. A package whose whole job is arithmetic over two lists of
# boxes should not be growing a function that trips either, so the first one
# to fire is new work, and is looked at.

# `x0`, `y0`, `x1`, `y1` — the four corners of a box, 14 of them across
# `PageBox` and the tests, and every one is right where it stands. A
# rectangle in fractions of a page has no better name for its left edge than
# `x0`, and `leftFractionOfThePage` would be a worse file to read, not a
# better one. The fifteenth is `to`, the far end of a span in
# `MarkedText.overlap`, which is the same argument about a shorter rectangle.
# The ceiling stays, because a forty-character name is a different problem.
identifier_name:
  min_length: 1

# Three members is what this tree holds, twice: the pieces, words and place
# that `MarkedText.mark` hands back about one band, and the word and its two
# edges that the tests build a line out of. Four is where a tuple stops being
# readable and wants a name.
large_tuple:
  warning: 3

opt_in_rules:
  # Rules that are off by default and earn their place here: each one names a
  # spelling that hides intent — a count compared to zero, a filter whose only
  # use is `isEmpty`, a `%` that means `isMultiple(of:)`.
  #
  # None of these fires today. They are guards, not clean-up: the point is that
  # the first one to fire is new work, and is looked at.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  # Zero force unwraps in the package today, product code and tests alike, and
  # that is the state worth keeping. Tests are not exempt: a `!` there ends the
  # whole run with a signal, so the case that failed is the one thing the
  # output does not name. The same reasoning retires `try?` over a `#require`
  # in a test that is not `throws`: it swallows the one error that would have
  # said which value was missing.
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# Prose is exempt — the long explanations above declarations are the point of
# this package, and wrapping them to a column would only make them worse. What
# is left is code, and code at 240 columns is not read, it is scrolled past.
# The ceiling is 150: the longest line in the tree today is 120 columns, a
# test assertion and its message, so the number is a bound on what may be
# added rather than a description of what is there.
line_length:
  warning: 150
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
